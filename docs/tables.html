<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabellen · Bundesbahnhofsliga</title>
<meta name="description" content="A weekly league table of German railway stations, ranked by how punctually long-distance trains (ICE, IC, EC) arrive.">
<link rel="icon" href="assets/logos/favicon.svg">
<link rel="stylesheet" href="assets/style.css?v=3d279d046a">
<script>(function(){var l;try{l=new URLSearchParams(location.search).get("lang")||localStorage.getItem("bbl-lang")}catch(e){}
if(l!=="de"&&l!=="en")l=/^de\b/i.test(navigator.language||"")?"de":"en";document.documentElement.dataset.lang=l;document.documentElement.lang=l})();</script>
</head>
<body>
<main class="wrap">
  <p class="tagline" id="tagline"></p>
  <p class="sub score-hint" id="score-hint"></p>
  <div class="matchdays" style="margin-top:0">
    <label for="season" id="season-label"></label> <select id="season"></select>
    <span id="season-state"></span>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="league-head"><img id="lg-logo" alt=""><div><h2 id="lg-name"></h2><div class="sub" id="lg-sub"></div></div></div>
  <div class="badges" id="badges"></div>
  <div class="matchdays" id="matchdays"></div>
  <div class="view-row" id="view"></div>
  <div id="table"></div>
  <div class="legend" id="legend"></div>
  <h2 id="moves-title"></h2>
  <div id="moves" class="moves"></div>
</main>
<script src="assets/app.js?v=b0226252d3"></script>
<script>
chrome("tables.html");
$("#tagline").textContent = T.tagline;
$("#score-hint").textContent = T.score_hint;
$("#season-label").textContent = T.season_label;
$("#moves-title").textContent = T.moves_title;
$("#legend").innerHTML = `<span class="lu">${T.legend[0]}</span><span class="lp">${T.legend[1]}</span><span class="ld">${T.legend[2]}</span><span>${T.legend[3]}</span>`;
const state = { season: null, league: null, md: null, meta: null, data: null, view: new URLSearchParams(location.search).get("view") === "day" ? "day" : "week" };
const params = new URLSearchParams(location.search);

async function init() {
  const meta = state.meta = await getJSON("data/meta.json");
  stamp(meta);
  const sel = $("#season");
  sel.innerHTML = meta.seasons.slice().reverse().map((s) =>
    `<option value="${s.id}">${s.id} (${dayLabel(s.start)} ${T.to} ${dayLabel(s.end)})${s.complete ? "" : " " + T.live}</option>`).join("");
  sel.value = params.get("season") || meta.latest;
  sel.onchange = () => loadSeason(sel.value);
  await loadSeason(sel.value);
}

async function loadSeason(id) {
  state.season = id;
  state.data = await getJSON(`data/season/${id}.json`);
  const s = state.data;
  $("#season-state").innerHTML = s.complete
    ? T.season_done
    : `<b style="color:var(--red)">${T.live}</b>: ${T.season_live(liveWeek(s, state.meta).n)} ${liveWeek(s, state.meta).note}`;
  const lids = s.league_order;
  if (!lids.includes(state.league)) state.league = params.get("liga") && lids.includes(params.get("liga")) ? params.get("liga") : lids[0];
  $("#tabs").innerHTML = lids.map((l) => {
    return `<button class="tab ${l === state.league ? "on" : ""}" data-l="${l}"><img src="${logo(l)}" alt="">${esc(s.leagues[l].short)}</button>`;
  }).join("");
  $("#tabs").querySelectorAll("button").forEach((b) => (b.onclick = () => { state.league = b.dataset.l; loadSeason(state.season); }));
  revealActive($("#tabs"));
  state.md = s.matchdays.length - 1;
  renderMoves();
  render();
}

function render() {
  const s = state.data, lid = state.league;
  const L = s.leagues[lid], lg = L;
  const rows = L.tables[state.md] || [];
  $("#lg-logo").src = logo(lid);
  $("#lg-name").textContent = lg.name;
  $("#lg-sub").innerHTML = `${esc(T.sub(rows.length, s.id, dayLabel(s.matchdays[state.md])))} · <a href="champions.html?liga=${lid}&lang=${LANG}">${T.ch_link}</a> · <a href="ranking.html?season=${s.id}&lang=${LANG}">${T.rk_link}</a>`;
  $("#matchdays").innerHTML = `${T.matchday}: ` + s.matchdays.map((d, i) =>
    `<button class="${i === state.md ? "on" : ""}" data-i="${i}">${dayButton(d, i, state.meta)}</button>`).join("");
  $("#matchdays").querySelectorAll("button[data-i]").forEach((b) => (b.onclick = () => { state.md = +b.dataset.i; render(); }));
  revealActive($("#matchdays"));
  $("#view").innerHTML = viewToggle(state);
  bindViewToggle($("#view"), state, render);
  $("#table").innerHTML = state.view === "day"
    ? dayTableHTML(dayRows(rows, state.md > 0 ? L.tables[state.md - 1] : [])) + `<p class="sub">${T.day_note(dayLabel(s.matchdays[state.md]))}</p>`
    : tableHTML(rows, s.zones[lid] || { up: 0, down: 0 }, L.status || {});
  $("#legend").style.display = state.view === "day" ? "none" : "";
  // fun badges
  const ranked = rows.filter((r) => r.ranked);
  const day = s.matchdays[state.md];
  let dayBest = null;
  for (const r of rows) {   // best punctuality on this day, within the selected league
    const p = r.form[r.form.length - 1];
    if (p != null && (!dayBest || p > dayBest.p || (p === dayBest.p && r.played > dayBest.r.played))) dayBest = { p, r };
  }
  const b = [];
  if (ranked[0]) b.push([lid === "1" ? T.leader_top : T.leader, `${ranked[0].station} (${num(ranked[0].avg, 3)})`]);
  if (ranked.length) b.push([T.lantern, `${ranked[ranked.length - 1].station} (${num(ranked[ranked.length - 1].avg, 3)})`]);
  if (dayBest) b.push([T.day_winner(dayLabel(day)), `${dayBest.r.station} (${num(dayBest.p)})`]);
  $("#badges").innerHTML = b.map(([k, v]) => `<div class="badge"><b>${k}</b>${esc(v)}</div>`).join("");
}

function renderFills() {   // transparency: who moved up to fill a gap, and who dropped out, at the start of this season
  const s = state.data, names = state.meta.stations;
  const name = (e) => esc(names[e]?.name || e);
  const short = (l) => s.leagues[l]?.short || l;
  let h = "";
  if (s.fills?.length) h += `<div class="card" style="grid-column:1/-1"><h3>${T.fills_title}</h3><ul>${
    s.fills.map((f) => `<li><a href="${stLink(f.eva)}">${name(f.eva)}</a>: ${esc(short(f.from))} → ${esc(short(f.to))}, ${T.filled[f.reason]}</li>`).join("")}</ul></div>`;
  if (s.dropped?.length) h += `<div class="card" style="grid-column:1/-1"><h3>${T.dropped_title(s.dropped.length)}</h3><p class="sub" style="margin:0">${
    s.dropped.map((d) => `<a href="${stLink(d.eva)}">${name(d.eva)}</a>`).join(" · ")}</p></div>`;
  return h;
}

async function renderMoves() {
  // show the moves of this season if complete, otherwise of the previous one
  const seasons = state.meta.seasons;
  let s = state.data;
  if (!s.complete) {
    const i = seasons.findIndex((x) => x.id === s.id);
    if (i <= 0) { $("#moves").innerHTML = renderFills() + `<p class="sub">${T.first_season}</p>`; return; }
    s = await getJSON(`data/season/${seasons[i - 1].id}.json`);
  }
  const names = state.meta.stations;
  const name = (e) => esc(names[e]?.name || e);
  const short = (l) => s.leagues[l]?.short || l;
  const tier = (l) => s.leagues[l]?.tier ?? state.meta.leagues.find((x) => x.id === l)?.tier ?? 9;
  const groups = {};
  const po = (s.playoffs || []).map((p) => {
    const won = p.kind === "promotion" || p.winner === p.lower_eva;
    const pct = (x) => (x == null ? T.called_off : num(x * 100, 1) + " %");
    return `<li>${short(p.upper)} vs ${short(p.lower)}: <a href="${stLink(p.upper_eva)}">${name(p.upper_eva)}</a>
      ${pct(p.upper_share)} : ${pct(p.lower_share)}
      <a href="${stLink(p.lower_eva)}">${name(p.lower_eva)}</a>, <b>${won ? T.po_up : T.po_stays}: ${name(p.winner)}</b></li>`;
  });
  for (const m of s.moves) {
    const up = tier(m.to) < tier(m.from);
    const key = up ? T.up_into(short(m.to)) : T.down_from(short(m.from));
    (groups[key] ||= []).push(m.eva);
  }
  $("#moves").innerHTML = renderFills() + `<p class="sub" style="grid-column:1/-1">${T.after(s.id)}</p>` +
    (s.promotion_round?.length ? `<div class="card" style="grid-column:1/-1"><h3>${T.round_title}</h3><ol>${
      s.promotion_round.map((c) => `<li><a href="${stLink(c.eva)}">${name(c.eva)}</a> (${esc(short(c.league))}, ${num(c.avg, 3)}):
        ${T.round_res[c.result] || c.result}</li>`).join("")}</ol></div>` : "") +
    (po.length ? `<div class="card" style="grid-column:1/-1"><h3>${T.po_title}</h3><ul>${po.join("")}</ul></div>` : "") +
    Object.entries(groups).map(([k, v]) => `<div class="card"><h3>${k}</h3><ul>${v.map((e) =>
      `<li><a href="${stLink(e)}">${name(e)}</a></li>`).join("")}</ul></div>`).join("");
}
init().catch((e) => { $("#table").innerHTML = `<p>${T.load_error(esc(e.message))}</p>`; });
</script>
</body>
</html>
