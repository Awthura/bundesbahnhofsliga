<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bundesbahnhofsliga · Die Liga der Bahnhöfe</title>
<meta name="description" content="Die Bundesliga der Bahnhöfe: eine wöchentliche Tabelle der deutschen Fernverkehrsbahnhöfe, entschieden von pünktlichen ICE, IC und EC. The Bundesliga of German railway stations, decided by punctual long-distance trains.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://awthura.github.io/bundesbahnhofsliga/">
<meta property="og:title" content="Bundesbahnhofsliga · Die Bundesliga der Bahnhöfe">
<meta property="og:description" content="Nur jeder zweite Fernzug kommt pünktlich an. Wie schlägt sich dein Bahnhof? Jede Woche eine Tabelle mit Auf- und Abstieg. Only every second long-distance train is on time: how does your station rank?">
<meta property="og:image" content="https://awthura.github.io/bundesbahnhofsliga/assets/share.png?v=kw45">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/logos/favicon.svg">
<link rel="stylesheet" href="assets/style.css?v=af3c884c76">
<script>(function(){var l;try{l=new URLSearchParams(location.search).get("lang")||localStorage.getItem("bbl-lang")}catch(e){}
if(l!=="de"&&l!=="en")l=/^de\b/i.test(navigator.language||"")?"de":"en";document.documentElement.dataset.lang=l;document.documentElement.lang=l})();</script>
<script>(function(){var p=new URLSearchParams(location.search);if(p.has("liga")||p.has("season")){location.replace("tables.html"+location.search);}})();</script>
</head>
<body>
<main class="wrap home">
  <section class="hero">
    <img src="assets/logos/bbl.svg" alt="" class="hero-logo">
    <div>
      <h1 class="hero-title">Bundesbahnhofsliga</h1>
      <p class="tagline" id="tagline"></p>
      <p class="sub score-hint" id="score-hint"></p>
      <span class="live-pill" id="live"></span>
    </div>
  </section>

  <section class="home-stats">
    <div class="home-stats-head">
      <div><h2 id="t-nat"></h2><p class="sub" id="t-nat-sub"></p></div>
      <span class="view-toggle" id="nat-period"></span>
    </div>
    <div class="kpis" id="nat-kpis"></div>
    <div class="mix" id="nat-mix"></div>
    <p><a id="nat-link" href="stats.html"></a></p>
  </section>

  <section class="home-grid">
    <div class="card home-card" id="card-ranking">
      <h2 id="t-ranking"></h2><p class="sub" id="t-ranking-sub"></p>
      <div class="podium-label" id="top-label"></div>
      <ol class="podium" id="podium"></ol>
      <div class="podium-label" id="bottom-label"></div>
      <ol class="podium bottom" id="bottom"></ol>
      <a class="btn" id="ranking-btn" href="ranking.html"></a>
    </div>
    <div class="card home-card" id="card-search">
      <h2 id="t-search"></h2><p class="sub" id="t-search-sub"></p>
      <div class="search">
        <input id="q" type="search" autocomplete="off" spellcheck="false" aria-autocomplete="list" aria-controls="results">
        <ul id="results" role="listbox"></ul>
      </div>
      <p class="popular" id="popular"></p>
    </div>
    <div class="card home-card" id="card-tables">
      <h2 id="t-tables"></h2><p class="sub" id="t-tables-sub"></p>
      <div class="crest-row" id="crests"></div>
      <div class="crest-label" id="regional"></div>
      <div class="crest-row small" id="crests-rl"></div>
    </div>
  </section>

  <h2 id="t-week"></h2>
  <div class="badges" id="week"></div>

  <h2 id="t-how"></h2>
  <div class="steps" id="steps"></div>
  <p><a id="rules-link" href="rules.html"></a></p>
</main>
<script src="assets/app.js?v=398156ceba"></script>
<script>
chrome("index.html");
const $$ = (id, txt) => ($(id).textContent = txt);
$$("#tagline", T.tagline); $$("#score-hint", T.score_hint);
$$("#t-tables", T.home_tables); $$("#t-tables-sub", T.home_tables_sub); $$("#regional", "Regionalbahnhofsligen");
$$("#t-ranking", T.home_ranking); $$("#ranking-btn", T.home_ranking_btn);
$$("#t-search", T.home_search); $("#q").placeholder = T.home_search_ph;
$$("#t-week", T.home_week); $$("#t-how", T.home_how); $$("#rules-link", T.home_rules + " →");
$("#steps").innerHTML = T.home_steps.map(([n, h, t]) => `<div class="card step"><b class="step-n">${n}</b><h3>${h}</h3><p class="sub">${t}</p></div>`).join("");

// nationwide rings: all ICE/IC/EC arrivals in Germany, from the map's national day sums
async function renderNational(meta) {
  const M = await getJSON("data/map.json"), days = M.days;
  const cur = M.seasons[M.seasons.length - 1];
  const sets = [days.map((d, k) => k).filter((k) => days[k] >= cur.start && days[k] <= cur.end), days.map((_, k) => k).slice(-28), days.map((_, k) => k)];
  const pc = (x, a) => (a ? num((100 * x) / a, 1) : "–");
  $$("#t-nat", T.home_nat); $("#nat-link").textContent = T.home_nat_link + " →"; $("#nat-link").href = `stats.html?lang=${LANG}`;
  const draw = (i) => {
    const ks = sets[i], v = ks.reduce((t, k) => t.map((x, j) => x + (M.national[k][j] || 0)), [0, 0, 0, 0, 0, 0, 0, 0]);
    const [a, p, c] = v, late = v[3] + v[4] + v[5] + v[6] + v[7];
    const run = ks.some((k) => days[k] === M.running) ? ` · ${T.running}` : "";
    $$("#t-nat-sub", T.map_range(dayLabel(days[ks[0]]), dayLabel(days[ks[ks.length - 1]])) + run + ` · ${a.toLocaleString(LANG)} ${T.mix_center[0]}`);
    $("#nat-kpis").innerHTML = [[pc(p, a) + " %", T.ns_kpi[1]], [pc(late, a) + " %", T.ns_kpi[2]], [pc(c, a) + " %", T.ns_kpi[3]], [pc(v[6] + v[7], a) + " %", T.ns_kpi[4]]]
      .map(([x, l]) => `<div class="kpi"><b>${x}</b><span>${l}</span></div>`).join("");
    const all = [{ label: T.mix_cats[0], n: p, col: "var(--mx-ok)" }, { label: T.mix_cats[1], n: late, col: "var(--mx-late)" }, { label: T.mix_cats[2], n: c, hatch: true }];
    const dis = [3, 4, 5, 6, 7].map((j, n) => ({ label: T.mix_bins[n], n: v[j], col: `var(--mx-b${n + 1})` })).concat([{ label: T.mix_bins[5], n: c, hatch: true }]);
    $("#nat-mix").innerHTML = donut(all, T.mix_center[0], T.mix_all, "ha") + donut(dis, T.mix_center[1], T.mix_dis, "hd");
    $("#nat-period").innerHTML = T.mix_periods.map((l, n) => `<button class="${n === i ? "on" : ""}" data-k="${n}">${l}</button>`).join("");
    $("#nat-period").querySelectorAll("button").forEach((b) => (b.onclick = () => draw(+b.dataset.k)));
  };
  draw(0);
}

(async () => {
  const meta = await getJSON("data/meta.json");
  stamp(meta);
  renderNational(meta);
  const s = await getJSON(`data/season/${meta.latest}.json`);
  const k = s.matchdays.length - 1;
  $$("#live", s.complete ? T.home_done(s.id) : T.home_live(s.id, liveWeek(s, meta).n));

  // league tables card: the three national leagues
  // all leagues, each straight to its table: national ones big, the five regional ones smaller
  const crest = (l, label) => `<a href="tables.html?liga=${l}&lang=${LANG}" class="crest-link" title="${esc(s.leagues[l].name)}"><img src="${logo(l)}" alt=""><span>${esc(label)}</span></a>`;
  $("#crests").innerHTML = s.league_order.filter((l) => !l.startsWith("RL")).map((l) => crest(l, s.leagues[l].short)).join("");
  $("#crests-rl").innerHTML = s.league_order.filter((l) => l.startsWith("RL")).map((l) => crest(l, s.leagues[l].name.replace("Regionalbahnhofsliga ", ""))).join("");

  // national ranking card: top 3 this week
  const nat = nationalTable(s, k);
  $$("#t-ranking-sub", T.home_ranking_sub(s.id));
  const item = (r) => `<li value="${r.nrank}"><a href="${stLink(r.eva)}">${esc(r.station)}</a> <img src="${logo(r.league)}" alt="" title="${esc(s.leagues[r.league].short)}"> <b>${num(r.avg, 3)}</b></li>`;
  $$("#top-label", T.home_top3); $$("#bottom-label", T.home_bottom3);
  $("#podium").innerHTML = nat.slice(0, 3).map(item).join("");
  const ranked = nat.filter((r) => r.ranked);   // only stations scored on enough days count as bottom 3
  $("#bottom").innerHTML = ranked.slice(-3).map(item).join("");
  $("#ranking-btn").href = `ranking.html?lang=${LANG}`;

  // this week: BBL leader, biggest climber since the day before, day winner nationwide
  const items = [];
  if (k > 0) {
    const before = Object.fromEntries(nationalTable(s, k - 1).map((r) => [r.eva, r.nrank]));
    const up = nat.filter((r) => before[r.eva]).map((r) => [r, before[r.eva] - r.nrank]).sort((a, b) => b[1] - a[1])[0];
    if (up && up[1] > 0) items.push([T.home_climber(dayLabel(s.matchdays[k])), `<a href="${stLink(up[0].eva)}">${esc(up[0].station)}</a>, ${T.home_climb_txt(up[1])}`]);
  }
  let best = null;
  for (const r of nat) { const p = r.form[r.form.length - 1]; if (p != null && (!best || p > best.p)) best = { p, r }; }
  if (best) items.push([T.home_day(dayLabel(s.matchdays[k])), `<a href="${stLink(best.r.eva)}">${esc(best.r.station)}</a> (${num(best.p)})`]);
  $("#week").innerHTML = items.map(([h, v]) => `<div class="badge"><b>${h}</b>${v}</div>`).join("");

  // search
  const list = Object.entries(meta.stations).map(([eva, x]) => ({ eva, name: x.name, league: x.league, key: fold(x.name) }));
  $$("#t-search-sub", T.home_search_sub(list.filter((x) => x.league).length));
  const q = $("#q"), res = $("#results");
  let hits = [], sel = 0;
  const draw = () => {
    const t = fold(q.value);
    if (!t) { res.innerHTML = ""; return; }
    const words = t.split(" ");
    hits = list.filter((x) => words.every((w) => x.key.includes(w)))
      .sort((a, b) => (a.key.startsWith(t) ? 0 : 1) - (b.key.startsWith(t) ? 0 : 1) || a.name.localeCompare(b.name, "de")).slice(0, 8);
    sel = Math.min(sel, Math.max(hits.length - 1, 0));
    res.innerHTML = hits.length ? hits.map((x, i) => `<li role="option" class="${i === sel ? "on" : ""}" data-i="${i}">
      ${x.league ? `<img src="${logo(x.league)}" alt="">` : ""}<span>${esc(x.name)}</span></li>`).join("")
      : `<li class="none">${T.home_search_none}</li>`;
    res.querySelectorAll("li[data-i]").forEach((li) => (li.onmousedown = () => go(hits[+li.dataset.i])));
  };
  const go = (x) => { if (x) location.href = stLink(x.eva); };
  q.addEventListener("input", () => { sel = 0; draw(); });
  const busiest = list.filter((x) => x.league).sort((a, b) => (meta.stations[b.eva].per_day || 0) - (meta.stations[a.eva].per_day || 0)).slice(0, 5);
  $("#popular").innerHTML = `${T.home_popular}: ` + busiest.map((x) => `<a href="${stLink(x.eva)}">${esc(x.name)}</a>`).join(" · ");
  const pre = new URLSearchParams(location.search).get("q");
  if (pre) { q.value = pre; draw(); }
  q.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { sel = Math.min(sel + 1, hits.length - 1); draw(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { sel = Math.max(sel - 1, 0); draw(); e.preventDefault(); }
    else if (e.key === "Enter") go(hits[sel]);
    else if (e.key === "Escape") { q.value = ""; draw(); }
  });
})().catch((e) => { console.error(e); $("#week").innerHTML = `<p>${T.load_error(esc(e.message))}</p>`; });
</script>
</body>
</html>
