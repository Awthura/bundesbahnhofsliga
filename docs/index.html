<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bundesbahnhofsliga</title>
<meta name="description" content="A weekly league table of German railway stations, ranked by how punctually ICE and IC trains arrive.">
<link rel="icon" href="assets/logos/favicon.svg">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main class="wrap">
  <div class="matchdays" style="margin-top:0">
    <label for="season">Saison (KW)</label> <select id="season"></select>
    <span id="season-state"></span>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="league-head"><img id="lg-logo" alt=""><div><h2 id="lg-name"></h2><div class="sub" id="lg-sub"></div></div></div>
  <div class="badges" id="badges"></div>
  <div class="matchdays" id="matchdays"></div>
  <div id="table"></div>
  <div class="legend"><span class="lu">Aufstieg</span><span class="lp">Relegation (Sunday playoff)</span><span class="ld">Abstieg</span>
    <span>Ranked by Schnitt = average daily points (0 to 1). Grey rows played too few matchdays so far.</span></div>
  <h2>Auf- und Abstieg</h2>
  <div id="moves" class="moves"></div>
</main>
<script src="assets/app.js"></script>
<script>
chrome("index.html");
const state = { season: null, league: null, md: null, meta: null, data: null };
const params = new URLSearchParams(location.search);

async function init() {
  const meta = state.meta = await getJSON("data/meta.json");
  stamp(meta);
  const sel = $("#season");
  sel.innerHTML = meta.seasons.slice().reverse().map((s) =>
    `<option value="${s.id}">${s.id} (${s.start.slice(5)} bis ${s.end.slice(5)})${s.complete ? "" : " LIVE"}</option>`).join("");
  sel.value = params.get("season") || meta.latest;
  sel.onchange = () => loadSeason(sel.value);
  await loadSeason(sel.value);
}

async function loadSeason(id) {
  state.season = id;
  state.data = await getJSON(`data/season/${id}.json`);
  const s = state.data;
  $("#season-state").innerHTML = s.complete
    ? `Saison beendet, Auf- und Abstieg vollzogen.`
    : `<b style="color:var(--red)">LIVE</b>: Spieltag ${s.matchdays.length} von 7. Promotion and relegation after Sunday.`;
  const lids = s.league_order;
  if (!lids.includes(state.league)) state.league = params.get("liga") && lids.includes(params.get("liga")) ? params.get("liga") : lids[0];
  $("#tabs").innerHTML = lids.map((l) => {
    return `<button class="tab ${l === state.league ? "on" : ""}" data-l="${l}"><img src="${logo(l)}" alt="">${esc(s.leagues[l].short)}</button>`;
  }).join("");
  $("#tabs").querySelectorAll("button").forEach((b) => (b.onclick = () => { state.league = b.dataset.l; loadSeason(state.season); }));
  state.md = s.matchdays.length - 1;
  renderMoves();
  render();
}

function render() {
  const s = state.data, lid = state.league;
  const L = s.leagues[lid], lg = L;
  const rows = L.tables[state.md] || [];
  $("#lg-logo").src = logo(lid);
  $("#lg-name").textContent = lg.name;
  $("#lg-sub").textContent = `${rows.length} Bahnhöfe · Saison ${s.id} · Tabelle nach ${dayLabel(s.matchdays[state.md])}`;
  $("#matchdays").innerHTML = `Spieltag: ` + s.matchdays.map((d, i) =>
    `<button class="${i === state.md ? "on" : ""}" data-i="${i}">${i + 1} · ${dayLabel(d)}</button>`).join("");
  $("#matchdays").querySelectorAll("button").forEach((b) => (b.onclick = () => { state.md = +b.dataset.i; render(); }));
  $("#table").innerHTML = tableHTML(rows, s.zones[lid] || { up: 0, down: 0 }, L.status || {});
  // fun badges
  const ranked = rows.filter((r) => r.ranked);
  const day = s.matchdays[state.md];
  let dayBest = null;
  for (const [l, x] of Object.entries(s.leagues)) for (const r of x.tables[state.md] || []) {
    const p = r.form[r.form.length - 1];
    if (p != null && (!dayBest || p > dayBest.p || (p === dayBest.p && r.played > dayBest.r.played))) dayBest = { p, r, l };
  }
  const b = [];
  if (ranked[0]) b.push([lid === "1" ? "Tabellenführer" : "Spitzenreiter", `${ranked[0].station} (${fmt(ranked[0].avg, 3)})`]);
  if (ranked.length) b.push(["Rote Laterne", `${ranked[ranked.length - 1].station} (${fmt(ranked[ranked.length - 1].avg, 3)})`]);
  if (dayBest) b.push([`Tagessieger ${dayLabel(day)}`, `${dayBest.r.station} (${fmt(dayBest.p)})`]);
  $("#badges").innerHTML = b.map(([k, v]) => `<div class="badge"><b>${k}</b>${esc(v)}</div>`).join("");
}

async function renderMoves() {
  // show the moves of this season if complete, otherwise of the previous one
  const seasons = state.meta.seasons;
  let s = state.data;
  if (!s.complete) {
    const i = seasons.findIndex((x) => x.id === s.id);
    if (i <= 0) { $("#moves").innerHTML = `<p class="sub">First season, nothing moved yet.</p>`; return; }
    s = await getJSON(`data/season/${seasons[i - 1].id}.json`);
  }
  const names = state.meta.stations;
  const name = (e) => esc(names[e]?.name || e);
  const short = (l) => s.leagues[l]?.short || `${l}. BBL`;
  const groups = {};
  const po = (s.playoffs || []).map((p) => {
    const won = p.winner === p.lower_eva;
    return `<li>${short(p.upper)} vs ${short(p.lower)}: <a href="station.html?eva=${p.upper_eva}">${name(p.upper_eva)}</a>
      ${p.upper_share == null ? "abgesagt" : fmt(p.upper_share * 100, 1) + "%"} : ${p.lower_share == null ? "abgesagt" : fmt(p.lower_share * 100, 1) + "%"}
      <a href="station.html?eva=${p.lower_eva}">${name(p.lower_eva)}</a>, <b>${won ? "goes up" : "stays up"}: ${name(p.winner)}</b></li>`;
  });
  for (const m of s.moves) {
    const up = +m.to < +m.from;
    const key = up ? `Aufsteiger in die ${short(m.to)}` : `Absteiger aus der ${short(m.from)}`;
    (groups[key] ||= []).push(m.eva);
  }
  $("#moves").innerHTML = `<p class="sub" style="grid-column:1/-1">After season ${s.id}:</p>` +
    (po.length ? `<div class="card" style="grid-column:1/-1"><h3>Relegation playoffs (Sunday punctuality)</h3><ul>${po.join("")}</ul></div>` : "") +
    Object.entries(groups).map(([k, v]) => `<div class="card"><h3>${k}</h3><ul>${v.map((e) =>
      `<li><a href="station.html?eva=${e}">${name(e)}</a></li>`).join("")}</ul></div>`).join("");
}
init().catch((e) => { $("#table").innerHTML = `<p>Could not load data (${esc(e.message)}).</p>`; });
</script>
</body>
</html>
