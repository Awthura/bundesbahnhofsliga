<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rangliste · Bundesbahnhofsliga</title>
<link rel="icon" href="assets/logos/favicon.svg">
<link rel="stylesheet" href="assets/style.css?v=7262ffddd4">
<script>(function(){var l;try{l=new URLSearchParams(location.search).get("lang")||localStorage.getItem("bbl-lang")}catch(e){}
if(l!=="de"&&l!=="en")l=/^de\b/i.test(navigator.language||"")?"de":"en";document.documentElement.dataset.lang=l;document.documentElement.lang=l})();</script>
</head>
<body>
<main class="wrap">
  <h1 id="rk-title" style="margin:4px 0 2px"></h1>
  <p class="sub" id="rk-intro"></p>
  <div class="matchdays" style="margin-top:0">
    <label for="season" id="season-label"></label> <select id="season"></select>
    <select id="state" aria-label="Bundesland"></select>
  </div>
  <div class="freq">
    <div class="freq-row">
      <input type="range" id="freq" min="0" max="180" step="5" value="0" aria-labelledby="freq-label">
      <span class="freq-presets" id="presets"></span>
    </div>
    <div class="sub" id="freq-label"></div>
  </div>
  <div class="matchdays" id="matchdays"></div>
  <div class="view-row" id="view"></div>
  <div id="table"></div>
  <p class="sub" id="freq-note"></p>
</main>
<script src="assets/app.js?v=a114e2f23f"></script>
<script>
chrome("ranking.html");
$("#rk-title").textContent = T.rk_title;
$("#rk-intro").textContent = T.rk_intro;
$("#season-label").textContent = T.season_label;
const params = new URLSearchParams(location.search);
const state = { meta: null, data: null, md: 0, filter: "", min: Math.max(0, +params.get("min") || 0), view: params.get("view") === "day" ? "day" : "week" };
$("#freq-note").textContent = T.rk_freq_note;

function render() {
  const s = state.data, meta = state.meta;
  $("#matchdays").innerHTML = `${T.matchday}: ` + s.matchdays.map((d, i) =>
    `<button class="${i === state.md ? "on" : ""}" data-i="${i}">${dayButton(d, i, state.meta.last_day)}</button>`).join("");
  $("#matchdays").querySelectorAll("button[data-i]").forEach((b) => (b.onclick = () => { state.md = +b.dataset.i; render(); }));
  $("#view").innerHTML = viewToggle(state);
  bindViewToggle($("#view"), state, render);
  revealActive($("#matchdays"));
  const rows = nationalTable(s, state.md);
  const prev = state.md > 0 ? Object.fromEntries(nationalTable(s, state.md - 1).map((r) => [r.eva, r.nrank])) : null;
  const perDay = (e) => meta.stations[e]?.per_day ?? 0;
  const shown = rows.filter((r) => (!state.filter || meta.stations[r.eva]?.state === state.filter) && perDay(r.eva) >= state.min);
  const filtered = shown.length !== rows.length;
  const prevShown = prev ? nationalTable(s, state.md - 1).filter((r) => (!state.filter || meta.stations[r.eva]?.state === state.filter) && perDay(r.eva) >= state.min) : null;
  const prevPos = prevShown ? Object.fromEntries(prevShown.map((r, i) => [r.eva, i + 1])) : null;
  $("#freq-label").textContent = `${T.rk_freq(state.min)} · ${T.rk_count(shown.length, rows.length)}`;
  $("#freq").value = state.min;
  $("#presets").innerHTML = T.rk_presets.map(([lbl, v]) => `<button class="${v === state.min ? "on" : ""}" data-v="${v}">${lbl}</button>`).join("");
  $("#presets").querySelectorAll("button").forEach((b) => (b.onclick = () => setMin(+b.dataset.v)));
  if (state.view === "day") {
    const keep = new Set(shown.map((r) => r.eva));
    const dr = dayRows(rows, state.md > 0 ? nationalTable(s, state.md - 1) : []).filter((r) => keep.has(r.eva));
    $("#table").innerHTML = dayTableHTML(dr, (r) => r.league) + `<p class="sub">${T.day_note(dayLabel(s.matchdays[state.md]))}</p>`;
    return;
  }
  const c = T.rk_cols;
  $("#table").innerHTML = `<div class="tablewrap"><table>
    <thead><tr><th>${c[0]}</th><th></th><th>${c[1]}</th><th><span class="hide-sm">${c[2]}</span></th><th class="hide-md">${c[3]}</th>
      <th class="num hide-sm">${T.rk_per_day}</th>${filtered ? `<th class="num hide-sm">${T.rk_nat}</th>` : ""}
      <th class="num hide-sm">${c[4]}</th><th class="num">${c[5]}</th></tr></thead><tbody>
    ${shown.map((r, i) => `<tr class="${r.ranked ? "" : "unranked"}">
      <td class="rank">${filtered ? i + 1 : r.nrank}.</td><td>${trendCell(filtered
        ? (prevPos && prevPos[r.eva] ? prevPos[r.eva] - (i + 1) : null)
        : (prev && prev[r.eva] ? prev[r.eva] - r.nrank : null))}</td>
      <td class="st"><a href="${stLink(r.eva)}">${esc(r.station)}</a></td>
      <td><a href="tables.html?season=${s.id}&liga=${r.league}&lang=${LANG}" title="${esc(s.leagues[r.league].name)}" style="color:var(--ink);text-decoration:none;white-space:nowrap">
        <img src="${logo(r.league)}" alt="" style="width:16px;height:19px;vertical-align:-4px"> <span class="hide-sm">${esc(s.leagues[r.league].short)}</span></a></td>
      <td class="hide-md">${esc(meta.stations[r.eva]?.state || "")}</td>
      <td class="num hide-sm">${Math.round(perDay(r.eva))}</td>${filtered ? `<td class="num hide-sm" style="color:var(--muted)">${r.nrank}.</td>` : ""}
      <td class="num hide-sm">${r.played}</td><td class="num"><b>${num(r.avg, 3)}</b></td></tr>`).join("")}
    </tbody></table></div>`;
}

function setMin(v) {
  state.min = v;
  const p = new URLSearchParams(location.search);
  if (v) p.set("min", v); else p.delete("min");
  history.replaceState(null, "", "?" + p.toString());
  render();
}
$("#freq").addEventListener("input", (e) => setMin(+e.target.value));

async function loadSeason(id) {
  state.data = await getJSON(`data/season/${id}.json`);
  state.md = state.data.matchdays.length - 1;
  render();
}

(async () => {
  const meta = state.meta = await getJSON("data/meta.json");
  stamp(meta);
  const sel = $("#season");
  sel.innerHTML = meta.seasons.slice().reverse().map((s) =>
    `<option value="${s.id}">${s.id} (${dayLabel(s.start)} ${T.to} ${dayLabel(s.end)})${s.complete ? "" : " " + T.live}</option>`).join("");
  sel.value = params.get("season") || meta.latest;
  sel.onchange = () => loadSeason(sel.value);
  const states = [...new Set(Object.values(meta.stations).map((x) => x.state).filter(Boolean))].sort((a, b) => a.localeCompare(b, "de"));
  $("#state").innerHTML = `<option value="">${T.rk_all}</option>` + states.map((x) => `<option>${esc(x)}</option>`).join("");
  $("#state").onchange = (e) => { state.filter = e.target.value; render(); };
  await loadSeason(sel.value);
})().catch((e) => { console.error(e); $("#table").innerHTML = `<p>${T.load_error(esc(e.message))}</p>`; });
</script>
</body>
</html>
