<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bahnhof · Bundesbahnhofsliga</title>
<link rel="icon" href="assets/logos/favicon.svg">
<link rel="stylesheet" href="assets/style.css?v=3d279d046a">
<script>(function(){var l;try{l=new URLSearchParams(location.search).get("lang")||localStorage.getItem("bbl-lang")}catch(e){}
if(l!=="de"&&l!=="en")l=/^de\b/i.test(navigator.language||"")?"de":"en";document.documentElement.dataset.lang=l;document.documentElement.lang=l})();</script>
</head>
<body>
<main class="wrap">
  <div class="league-head"><img id="logo" alt=""><div><h2 id="name">…</h2><div class="sub" id="sub"></div></div></div>
  <h3 id="mix-title"></h3>
  <span class="view-toggle" id="mix-period"></span>
  <div class="mix" id="mix"></div>
  <p class="sub" id="mix-note"></p>
  <h3 id="chart-title"></h3>
  <div id="chart-box"><svg class="chart" id="chart" role="img"></svg></div>
  <p class="sub" id="chart-note"></p>
  <div class="kpis" id="kpis"></div>
  <div class="kpis" id="kpis2"></div>
  <div class="kpis" id="kpis3"></div>
  <div id="forecast"></div>
  <h3 id="wd-title"></h3>
  <div id="weekdays" class="pyramid"></div>
  <p class="sub" id="wd-note"></p>
  <h3 id="pyr-title"></h3>
  <div id="pyramid" class="pyramid"></div>
  <p class="sub" id="pyr-note"></p>
  <h3 id="rec-title"></h3>
  <div class="kpis" id="records"></div>
  <h3 id="hist-title"></h3>
  <div id="hist"></div>
</main>
<script src="assets/app.js?v=77a7bb0717"></script>
<script>
chrome("");
$("#chart-title").textContent = T.chart_title;
$("#chart").setAttribute("aria-label", T.chart_title);
$("#chart-note").textContent = T.chart_note;
$("#hist-title").textContent = T.hist_title;
$("#pyr-title").textContent = T.pyr_title;
$("#wd-title").textContent = T.wd_title;
$("#wd-note").textContent = T.wd_note;
$("#rec-title").textContent = T.rec_title;
$("#pyr-note").textContent = T.pyr_note;
(async () => {
  const eva = new URLSearchParams(location.search).get("eva");
  const [meta, st] = await Promise.all([getJSON("data/meta.json"), getJSON(`data/stations/${encodeURIComponent(eva)}.json`)]);
  stamp(meta);
  document.title = `${st.name} · Bundesbahnhofsliga`;
  const cur = meta.stations[eva]?.league;
  const lg = meta.leagues.find((l) => l.id === cur);
  $("#name").textContent = st.name;
  $("#sub").innerHTML = [lg ? `<a class="lg-link sub-link" href="tables.html?liga=${cur}&lang=${LANG}">${esc(lg.name)}</a>` : esc(T.st_none),
    st.state ? esc(st.state) : ""].filter(Boolean).join(" · ");
  if (cur) $("#logo").src = logo(cur); else $("#logo").remove();
  const played = st.daily.filter((d) => d.plays);
  const avg = played.length ? played.reduce((a, d) => a + d.points, 0) / played.length : null;
  const k = [
    [num(avg, 3), T.kpi[0]],
    [played.length, T.kpi[1]],
    [st.best ? num(st.best.points) : "-", st.best ? `${T.kpi[2]}, ${dayLabel(st.best.day)}` : T.kpi[2]],
    [st.worst ? num(st.worst.points) : "-", st.worst ? `${T.kpi[3]}, ${dayLabel(st.worst.day)}` : T.kpi[3]],
  ];
  $("#kpis").innerHTML = k.map(([v, l]) => `<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join("");

  if (st.forecast && !st.forecast.no_service) whenSized($("#forecast"), (w) => renderForecast(st, w - 34));
  else renderForecast(st, 0);
  whenSized($("#pyramid"), (w) => renderPyramid(st, meta, w));
  renderStats(st);
  whenSized($("#weekdays"), (w) => renderWeekdays(st, w));
  renderMix(st, 1);

  const drawDaily = (W) => {
  // bar chart, plain SVG
    const svg = $("#chart"), H = 180, pad = 24, n = st.daily.length;
    const bw = (W - pad) / Math.max(n, 1);
    let g = "";
    for (const y of [0, 0.5, 1]) {
      const yy = H - 16 - y * (H - 30);
      g += `<line x1="${pad}" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="0" y="${yy + 4}" font-size="10" fill="var(--muted)">${y}</text>`;
    }
    st.daily.forEach((d, i) => {
      const x = pad + i * bw;
      if (!d.plays) { g += `<rect x="${x}" y="${H - 18}" width="${Math.max(bw - 1, 1)}" height="3" fill="var(--muted)"><title>${d.day}: ${T.called_off}</title></rect>`; return; }
      const h = d.points * (H - 30);
      const c = d.points >= 0.85 ? "var(--up)" : d.points >= 0.7 ? "#8c8c8c" : "var(--red)";
      g += `<rect x="${x}" y="${H - 16 - h}" width="${Math.max(bw - 1, 1)}" height="${h}" fill="${c}"><title>${d.day}: ${num(d.points)} (${d.arrivals} ${T.arrivals}${d.canceled ? ", " + T.canc_day(d.canceled) : ""})</title></rect>`;
    });
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.innerHTML = g;
  };
  whenSized($("#chart-box"), drawDaily);

  const hc = T.hist_cols;
  $("#hist").innerHTML = `<div class="tablewrap"><table><thead><tr><th>${hc[0]}</th><th>${hc[1]}</th><th class="num">${hc[2]}</th>
    <th class="num hide-sm">${hc[3]}</th><th class="num">${hc[4]}</th></tr></thead><tbody>${st.history.slice().reverse().map((h) => {
      const l = { short: h.short || h.league };
      return `<tr><td><a href="tables.html?season=${h.season}&liga=${h.league}&lang=${LANG}">${h.season}</a>${h.complete ? "" : ` <span class="tag new">${T.live}</span>`}</td>
        <td class="st"><a class="lg-link" href="tables.html?season=${h.season}&liga=${h.league}&lang=${LANG}" title="${esc(l.short)}"><img src="${logo(h.league)}" alt="${esc(l.short)}" style="width:16px;height:19px;vertical-align:-4px"> <span class="hide-sm">${esc(l.short)}</span></a></td>
        <td class="num">${h.rank}.</td><td class="num hide-sm">${h.played}</td><td class="num">${num(h.avg, 3)}</td></tr>`;
    }).join("")}</tbody></table></div>`;
})().catch((e) => {
  console.error(e);
  if (e && e.status === 404) $("#name").textContent = T.st_missing;   // only a missing station is "not found"
  else { $("#name").textContent = "Bundesbahnhofsliga"; $("#sub").textContent = T.st_error(e && e.message ? e.message : e); }
});

// Charts are drawn at their box's real width. ResizeObserver tells us that width once layout is done
// (and again on resize or phone rotation), so charts are never drawn for a wrong, intermediate size.
function whenSized(el, draw) {
  let last = 0;
  const run = (w) => { w = Math.floor(w); if (w > 0 && w !== last) { last = w; draw(w); } };
  if ("ResizeObserver" in window) new ResizeObserver((es) => run(es[0].contentRect.width)).observe(el);
  else run(el.clientWidth);
}

function renderStats(st) {
  const x = st.stats; if (!x) return;
  const n = x.national, v = x.volume;
  const cards = [];
  if (n) {
    const note = T.st_rank_note(n.season, num(n.avg, 3));
    const link = (txt) => `<a href="ranking.html?season=${n.season}&lang=${LANG}">${txt}</a>`;
    cards.push([`${link(T.st_rank(n.rank, n.of))} ${trendCell(n.change ?? null)}`, note]);
    if (n.state) cards.push([`${T.st_state(n.state_rank, n.state_of, esc(n.state))} ${trendCell(n.state_change ?? null)}`, note]);
  }
  if (v.avg_per_day != null) cards.push([num(v.avg_per_day, 1), T.vol_avg]);
  if (v.busiest) cards.push([v.busiest.arrivals, T.vol_busiest(dayLabel(v.busiest.day))]);
  $("#kpis2").innerHTML = cards.map(([a, b]) => `<div class="kpi"><b class="kpi-small">${a}</b><span>${b}</span></div>`).join("");
  const cx = st.stats.cancel, pc = (x) => (x && x.rate != null ? num(x.rate * 100, 1) : "–"), cc = [];
  if (cx) {
    cc.push([pc(cx.all) + " %", T.canc_cards[0](pc(cx.all))], [pc(cx.last28) + " %", T.canc_cards[1](pc(cx.last28))]);
    if (cx.week && cx.week.arrivals) cc.push([cx.week.canceled, T.canc_cards[2](cx.week.canceled, cx.week.arrivals)]);
    if (cx.worst) cc.push([cx.worst.canceled, T.canc_cards[3](dayLabel(cx.worst.day), cx.worst.canceled, cx.worst.arrivals)]);
  }
  $("#kpis3").innerHTML = cc.map(([a, b]) => `<div class="kpi"><b class="kpi-small">${a}</b><span>${b.replace(/^[\d,.–]+ ?% ?/, "")}</span></div>`).join("");
  const r = x.records, s = x.streaks;
  const wk = (w) => (w ? `${num(w.avg, 3)}<span>${w.season} · ${T.place(w.rank, esc(w.short))}</span>` : "-");
  const rec = [
    [T.rec.best, wk(r.best_week)], [T.rec.worst, wk(r.worst_week)],
    [T.rec.highest, r.highest ? `${esc(r.highest.short)}<span>${r.highest.season} · ${r.highest.rank}.</span>` : "-"],
    [T.rec.titles, `${r.titles}`], [T.rec.moves, `${r.promotions} / ${r.relegations}`],
    [T.rec.longest, `${T.n_days(s.longest)}<span>${s.longest ? `${dayLabel(s.longest_from)} ${T.to} ${dayLabel(s.longest_to)} · ` : ""}${T.rec.current_short(T.n_days(s.current))}</span>`],
  ];
  $("#records").innerHTML = rec.map(([k, v]) => `<div class="kpi"><span>${k}</span><b class="kpi-small">${v}</b></div>`).join("");
}

function renderMix(st, k) {
  $("#mix-title").textContent = T.mix_title;
  const keys = ["week", "last28", "all"], m = st.stats.delays && st.stats.delays[keys[k]];
  $("#mix-period").innerHTML = T.mix_periods.map((l, i) => `<button class="${i === k ? "on" : ""}" data-k="${i}">${l}</button>`).join("");
  $("#mix-period").querySelectorAll("button").forEach((b) => (b.onclick = () => renderMix(st, +b.dataset.k)));
  if (!m || !m.days || !m.arrivals) { $("#mix").innerHTML = `<p class="sub">${T.mix_none}</p>`; $("#mix-note").textContent = ""; return; }
  const bins = ["d6_15", "d16_30", "d31_60", "d61_120", "d121p"], late = bins.reduce((t, b) => t + m[b], 0);
  const all = [{ label: T.mix_cats[0], n: m.punctual, col: "var(--mx-ok)" }, { label: T.mix_cats[1], n: late, col: "var(--mx-late)" },
    { label: T.mix_cats[2], n: m.canceled, hatch: true }];
  const dis = bins.map((b, i) => ({ label: T.mix_bins[i], n: m[b], col: `var(--mx-b${i + 1})` }))
    .concat([{ label: T.mix_bins[5], n: m.canceled, hatch: true }]);
  $("#mix").innerHTML = donut(all, T.mix_center[0], T.mix_all, "a")
    + (late + m.canceled ? donut(dis, T.mix_center[1], T.mix_dis, "d") : `<div class="mix-card"><p class="sub">${T.mix_nodis}</p></div>`);
  $("#mix-note").textContent = T.mix_note(m.days);
}

function renderWeekdays(st, W) {
  const wd = st.stats?.weekdays; if (!wd) return;
  const vals = wd.filter((d) => d.avg != null).map((d) => d.avg);
  const hi = Math.max(...vals), lo = Math.min(...vals);
  const H = 150, B = 22, top = 18, bw = W / 7;
  const names = [1, 2, 3, 4, 5, 6, 0].map((i) => T.days[i]);
  let g = "";
  wd.forEach((d, i) => {
    const x = i * bw + bw * 0.18, w = bw * 0.64;
    if (d.avg == null) return;
    const h = d.avg * (H - B - top), y = H - B - h;
    const c = d.avg === hi ? "var(--up)" : d.avg === lo ? "var(--red)" : "#8c8c8c";
    g += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="${c}"><title>${names[i]}: ${num(d.avg, 3)} (${T.n_days(d.days)})</title></rect>
      <text x="${x + w / 2}" y="${y - 5}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${num(d.avg, 2)}</text>`;
  });
  g += names.map((nm, i) => `<text x="${i * bw + bw / 2}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--muted)">${nm}</text>`).join("");
  $("#weekdays").innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block" role="img" aria-label="${T.wd_title}">${g}</svg>`;
}

function renderPyramid(st, meta, width) {
  const h = st.history, box = $("#pyramid");
  if (!h.length) return;
  const W = Math.max(width, 260), band = W < 500 ? 38 : 44, tiers = 4, H = band * tiers + 22;
  const PW = W < 500 ? 92 : 120, cx = PW / 2 - 2, x0 = PW + 14, x1 = W - 12;
  const regional = h.slice().reverse().find((r) => r.tier === 4);
  const names = { 1: "BBL", 2: "2. BBL", 3: "3. BL", 4: regional ? regional.short : "RBL" };
  const cur = h[h.length - 1].tier;
  let g = "";
  for (let t = 1; t <= tiers; t++) {   // the pyramid: narrow at the top, wide at the bottom
    const top = (t - 1) * band + 2, bot = t * band - 2, wt = 26 + (t - 1) * (PW - 30) / tiers, wb = 26 + t * (PW - 30) / tiers;
    const on = t === cur;
    g += `<path d="M${cx - wt / 2} ${top} L${cx + wt / 2} ${top} L${cx + wb / 2} ${bot} L${cx - wb / 2} ${bot} Z"
      fill="${on ? "var(--red)" : "var(--line)"}"/>
      <text x="${cx}" y="${(top + bot) / 2 + 4}" text-anchor="middle" font-size="${W < 500 ? 9 : 11}" font-weight="700"
      fill="${on ? "#fff" : "var(--ink)"}">${esc(t === 4 && W < 500 ? "RBL" : names[t])}</text>`;
    g += `<rect x="${x0}" y="${(t - 1) * band}" width="${x1 - x0}" height="${band}" fill="${t % 2 ? "var(--panel)" : "var(--bg)"}" opacity="0.9"/>
      <line x1="${x0}" x2="${x1}" y1="${t * band}" y2="${t * band}" stroke="var(--line)"/>`;
  }
  const xs = (i) => (h.length === 1 ? (x0 + x1) / 2 : x0 + 10 + (i * (x1 - x0 - 20)) / (h.length - 1));
  const ys = (r) => (r.tier - 1) * band + 5 + ((r.rank - 0.5) / Math.max(r.size, 1)) * (band - 10);
  g += `<path d="${h.map((r, i) => `${i ? "L" : "M"}${xs(i).toFixed(1)} ${ys(r).toFixed(1)}`).join(" ")}"
    fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" opacity="0.75"/>`;
  h.forEach((r, i) => {
    const c = r.move === "up" ? "var(--up)" : r.move === "down" ? "var(--red)" : "var(--ink)";
    const live = !r.complete;
    const ring = r.filled ? `<circle cx="${xs(i)}" cy="${ys(r)}" r="8" fill="none" stroke="#d99a00" stroke-width="2.5"/>` : "";
    g += `${ring}<circle cx="${xs(i)}" cy="${ys(r)}" r="${live ? 5 : 4.5}" fill="${live ? "var(--panel)" : c}" stroke="${c}" stroke-width="2">
      <title>${r.season}: ${r.short}, ${r.rank}. ${LANG === "de" ? "von" : "of"} ${r.size}, ${num(r.avg, 3)}${r.filled ? " · " + T.filled[r.filled] : ""}</title></circle>`;
  });
  g += `<text x="${xs(0)}" y="${H - 6}" font-size="10" text-anchor="${h.length === 1 ? "middle" : "start"}" fill="var(--muted)">${h[0].season}</text>`;
  if (h.length > 1) g += `<text x="${xs(h.length - 1)}" y="${H - 6}" font-size="10" text-anchor="end" fill="var(--muted)">${h[h.length - 1].season}</text>`;
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block" role="img" aria-label="${T.pyr_title}">${g}</svg>`;
}

function renderForecast(st, width) {
  const f = st.forecast, box = $("#forecast");
  if (!f) return;
  if (f.no_service) { box.innerHTML = `<div class="forecast-card"><h3>${T.fc_title}</h3><p class="sub">${T.fc_no_service}</p></div>`; return; }
  const yes = Math.round(f.p_yes * 100), no = 100 - yes;
  // probability history: one line, 0-100 %, outcomes as dots at top (yes) and bottom (no)
  const pts = f.history.concat([{ day: f.day, p: f.p_yes, yes: null }]);
  const W = Math.max(width, 240), H = W < 500 ? 140 : 170, L = 34, R = 8, Tp = 10, B = 22;
  const x = (i) => L + (i * (W - L - R)) / Math.max(pts.length - 1, 1);
  const y = (p) => Tp + (1 - p) * (H - Tp - B);
  let g = "";
  for (const v of [0, 0.5, 1]) {
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v === 0.5 ? 'stroke-dasharray="4 4"' : ""}/>
      <text x="${L - 6}" y="${y(v) + 4}" font-size="10" text-anchor="end" fill="var(--muted)">${v * 100}%</text>`;
  }
  const line = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(p.p).toFixed(1)}`).join(" ");
  g += `<path d="${line} L${x(pts.length - 1).toFixed(1)} ${y(0)} L${x(0)} ${y(0)} Z" fill="var(--up)" opacity="0.08"/>`;
  g += `<path d="${line}" fill="none" stroke="var(--up)" stroke-width="2.2" stroke-linejoin="round"/>`;
  pts.forEach((p, i) => {
    if (p.yes == null) return;
    g += `<circle cx="${x(i)}" cy="${p.yes ? y(1) : y(0)}" r="2.6" fill="${p.yes ? "var(--up)" : "var(--red)"}"><title>${p.day}: ${p.yes ? T.yes : T.no} (${Math.round(p.p * 100)}%)</title></circle>`;
  });
  const last = pts.length - 1;
  g += `<circle cx="${x(last)}" cy="${y(f.p_yes)}" r="4.5" fill="var(--up)" stroke="var(--panel)" stroke-width="2"/>`;
  g += `<text x="${L}" y="${H - 4}" font-size="10" fill="var(--muted)">${dayLabel(pts[0].day)}</text>
    <text x="${W - R}" y="${H - 4}" font-size="10" text-anchor="end" fill="var(--muted)">${dayLabel(f.day)}</text>`;
  box.innerHTML = `<div class="forecast-card">
    <div class="mk-head">
      <div>
        <h3>${T.fc_title}</h3>
        <div class="mk-q">${T.fc_q(esc(st.name), dayLabel(f.day), Math.round(f.threshold * 100))}</div>
      </div>
      <div>
        <div class="mk-odds">
          <div class="mk-yes"><span>${T.yes}</span><b>${yes}%</b></div>
          <div class="mk-no"><span>${T.no}</span><b>${no}%</b></div>
        </div>
        <div class="mk-bar" role="img" aria-label="${T.yes} ${yes}%, ${T.no} ${no}%"><i style="width:${yes}%"></i></div>
        <p class="sub mk-live">${f.live ? (f.live.decided ? `<b>${T.fc_decided[f.live.decided]}</b>`
          : `${T.fc_live(f.live.punctual, f.live.due, f.live.expected_total)} ${T.fc_pre(Math.round(f.prior_p_yes * 100))}`) : T.fc_waiting}</p>
      </div>
    </div>
    <svg class="mk-chart" viewBox="0 0 ${W} ${H}" style="height:${H}px" role="img" aria-label="${T.fc_legend}">${g}</svg>
    <p class="sub">${T.fc_expected(Math.round(f.expected * 100), Math.round(f.low * 100), Math.round(f.high * 100))}${f.brier != null ? "<br>" + T.fc_brier(num(f.brier, 3), f.resolved) : ""}</p>
    <p class="sub mk-small">${T.fc_legend} ${T.fc_note}</p>
  </div>`;
}
</script>
</body>
</html>
