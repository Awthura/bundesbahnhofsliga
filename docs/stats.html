<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statistik · Bundesbahnhofsliga</title>
<link rel="icon" href="assets/logos/favicon.svg">
<link rel="stylesheet" href="assets/style.css?v=af3c884c76">
<script>(function(){var l;try{l=new URLSearchParams(location.search).get("lang")||localStorage.getItem("bbl-lang")}catch(e){}
if(l!=="de"&&l!=="en")l=/^de\b/i.test(navigator.language||"")?"de":"en";document.documentElement.dataset.lang=l;document.documentElement.lang=l})();</script>
</head>
<body>
<main class="wrap">
  <h1 id="t" style="margin:4px 0 2px"></h1>
  <p class="sub" id="intro"></p>
  <div class="map-ctl" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0">
    <select id="land" aria-label="Bundesland"></select><span class="view-toggle" id="period"></span><select id="pick" aria-label="Zeitraum"></select></div>
  <p><b id="when"></b></p>
  <div class="kpis" id="kpis"></div>
  <div class="mix" id="mix"></div>
  <h3 id="cmp-title"></h3>
  <div id="cmp"></div>
  <p class="sub" id="note"></p>
</main>
<script src="assets/app.js?v=398156ceba"></script>
<script>
chrome("stats.html");
$("#t").textContent = T.ns_title; $("#intro").textContent = T.ns_intro; $("#cmp-title").textContent = T.ns_cmp;
// national day sums from the map data: [arrivals, punctual, cancelled, late 6-15, 16-30, 31-60, 61-120, >120 min]
const S = { period: 1, pick: null, land: new URLSearchParams(location.search).get("land") || "" };   // "" = all of Germany
const pc = (k, a) => (a ? num((100 * k) / a, 1) : "–");
(async () => {
  const [M, meta] = await Promise.all([getJSON("data/map.json"), getJSON("data/meta.json")]);
  stamp(meta);
  const days = M.days, idx = Object.fromEntries(days.map((d, i) => [d, i]));
  if (S.land && !M.states[S.land]) S.land = "";
  const src = () => (S.land ? M.states[S.land] : M.national);
  const sum = (ks) => ks.reduce((t, k) => t.map((x, j) => x + ((src()[k] && src()[k][j]) || 0)), [0, 0, 0, 0, 0, 0, 0, 0]);
  $("#land").innerHTML = `<option value="">${T.ns_all}</option>` + Object.keys(M.states).sort((a, b) => a.localeCompare(b, "de"))
    .map((s) => `<option value="${esc(s)}">${esc(s)}</option>`).join("");
  $("#land").value = S.land;
  $("#land").onchange = (e) => {
    S.land = e.target.value;
    const p = new URLSearchParams(location.search); if (S.land) p.set("land", S.land); else p.delete("land");
    history.replaceState(null, "", "?" + p.toString()); render(); renderCmp();
  };
  const weekKs = (s) => days.map((d, k) => k).filter((k) => days[k] >= s.start && days[k] <= s.end);
  const last28 = days.map((_, k) => k).slice(-28), all = days.map((_, k) => k);
  const tag = (ks) => (ks.some((k) => days[k] === M.running) ? ` · ${T.running}` : ks.some((k) => (M.pending || []).includes(days[k])) ? ` · ${T.pending}` : "");
  function selection() {
    if (S.period === 0) return [idx[S.pick] ?? days.length - 1];
    if (S.period === 1) return weekKs(M.seasons.find((s) => s.id === S.pick) || M.seasons[M.seasons.length - 1]);
    return S.period === 2 ? last28 : all;
  }
  function fillPick() {
    const sel = $("#pick");
    sel.style.display = S.period < 2 ? "" : "none";
    if (S.period === 0) {
      sel.innerHTML = days.slice().reverse().map((d) => `<option value="${d}">${dayLabel(d)}${d === M.running ? " · " + T.running : ""}</option>`).join("");
      S.pick = M.running && days.length > 1 ? days[days.length - 2] : days[days.length - 1];   // last finished day
    } else if (S.period === 1) {
      sel.innerHTML = M.seasons.slice().reverse().map((s) => `<option value="${s.id}">${s.id} (${dayLabel(s.start)} ${T.to} ${dayLabel(s.end)})${s.complete ? "" : " " + T.live}</option>`).join("");
      S.pick = M.seasons[M.seasons.length - 1].id;
    }
    sel.value = S.pick;
  }
  function render() {
    const ks = selection(), v = sum(ks), [a, p, c] = v, late = v[3] + v[4] + v[5] + v[6] + v[7];
    $("#t").textContent = S.land ? T.ns_title_land(S.land) : T.ns_title;
    $("#when").textContent = T.map_range(dayLabel(days[ks[0]]), dayLabel(days[ks[ks.length - 1]])) + tag(ks);
    const k = [[a.toLocaleString(LANG), T.ns_kpi[0]], [pc(p, a) + " %", T.ns_kpi[1]], [pc(late, a) + " %", T.ns_kpi[2]],
      [pc(c, a) + " %", T.ns_kpi[3]], [pc(v[6] + v[7], a) + " %", T.ns_kpi[4]]];
    $("#kpis").innerHTML = k.map(([x, l]) => `<div class="kpi"><b>${x}</b><span>${l}</span></div>`).join("");
    const allParts = [{ label: T.mix_cats[0], n: p, col: "var(--mx-ok)" }, { label: T.mix_cats[1], n: late, col: "var(--mx-late)" },
      { label: T.mix_cats[2], n: c, hatch: true }];
    const dis = [3, 4, 5, 6, 7].map((j, i) => ({ label: T.mix_bins[i], n: v[j], col: `var(--mx-b${i + 1})` }))
      .concat([{ label: T.mix_bins[5], n: c, hatch: true }]);
    $("#mix").innerHTML = a ? donut(allParts, T.mix_center[0], T.mix_all, "a") + donut(dis, T.mix_center[1], T.mix_dis, "d") : `<p class="sub">${T.mix_none}</p>`;
    $("#period").innerHTML = T.ns_period.map((l, i) => `<button class="${S.period === i ? "on" : ""}" data-p="${i}">${l}</button>`).join("");
    $("#period").querySelectorAll("button").forEach((b) => (b.onclick = () => { S.period = +b.dataset.p; fillPick(); render(); }));
  }
  // comparison table: percentages of all arrivals per period
  const cur = M.seasons[M.seasons.length - 1], done = M.seasons.filter((s) => s.complete);
  const rows = [[T.ns_cmp_rows[0], weekKs(cur)], [T.ns_cmp_rows[1] + (done.length ? ` (${done[done.length - 1].id})` : ""), done.length ? weekKs(done[done.length - 1]) : []],
    [T.ns_cmp_rows[2], last28], [T.ns_cmp_rows[3], all]].filter((r) => r[1].length);
  const cc = T.ns_cmp_cols;
  const renderCmp = () => { $("#cmp").innerHTML = `<div class="tablewrap"><table><thead><tr><th>${cc[0]}</th><th class="num hide-sm">${cc[1]}</th>${cc.slice(2).map((h) => `<th class="num">${h} %</th>`).join("")}</tr></thead><tbody>
    ${rows.map(([l, ks]) => { const v = sum(ks); return `<tr><td class="st" style="min-width:150px">${esc(l)}<span class="sub" style="display:block;font-size:12px">${T.map_range(dayLabel(days[ks[0]]), dayLabel(days[ks[ks.length - 1]]))}${tag(ks)}</span></td>
      <td class="num hide-sm">${v[0].toLocaleString(LANG)}</td>${[1, 3, 4, 5, 6, 7, 2].map((j) => `<td class="num">${j === 1 ? "<b>" : ""}${pc(v[j], v[0])}${j === 1 ? "</b>" : ""}</td>`).join("")}</tr>`; }).join("")}
    </tbody></table></div>`; };
  renderCmp();
  $("#note").textContent = T.ns_note(dayLabel(days[0]), dayLabel(days[days.length - 1]));
  $("#pick").onchange = (e) => { S.pick = e.target.value; render(); };
  fillPick();
  render();
})().catch((e) => { console.error(e); $("#mix").innerHTML = `<p>${T.load_error(esc(e.message))}</p>`; });
</script>
</body>
</html>
