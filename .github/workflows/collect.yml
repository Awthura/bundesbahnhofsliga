# Optional: our own DB Timetables API collector. Does nothing until DB_CLIENT_ID and DB_API_KEY are set.
name: Collect DB API data

on:
  schedule:
    - cron: "5 * * * *"        # hourly
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_CLIENT_ID: ${{ secrets.DB_CLIENT_ID }}
      HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
    steps:
      - name: Skip without credentials
        if: env.DB_CLIENT_ID == '' || env.HETZNER_HOST == ''
        run: echo "DB API or server secrets not configured, nothing to do."
      - uses: actions/checkout@v4
        if: env.DB_CLIENT_ID != '' && env.HETZNER_HOST != ''
      - uses: actions/setup-python@v5
        if: env.DB_CLIENT_ID != '' && env.HETZNER_HOST != ''
        with:
          python-version: "3.12"
      - name: Collect
        if: env.DB_CLIENT_ID != '' && env.HETZNER_HOST != ''
        run: |
          pip install -r requirements.txt
          python -m scripts.collect
        env:
          DB_API_KEY: ${{ secrets.DB_API_KEY }}
      - name: Upload to server
        if: env.DB_CLIENT_ID != '' && env.HETZNER_HOST != ''
        run: bash ops/ssh_setup.sh && bash ops/sync.sh push-collector
        env:
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
